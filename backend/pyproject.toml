[project]
name = "careflow-backend"
version = "0.5.0"
description = "CareFlow — AI productivity tool for HK eldercare social workers"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "openai>=1.50",
  "openpyxl>=3.1",
  "Pillow>=10.4",
  "httpx>=0.27",
  "requests>=2.32",
  "python-dateutil>=2.9",
  "python-docx>=1.1",
  "cryptography>=43",
  "PyMuPDF>=1.24",
  "azure-ai-inference>=1.0.0b9",
  "dashscope>=1.20.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.services.visit_note_agent" = ["prompts/*.txt"]

[project.urls]
Repository = "https://github.com/OscarXuHz/OpenCareFlow"
Issues = "https://github.com/OscarXuHz/OpenCareFlow/issues"
Security = "https://github.com/OscarXuHz/OpenCareFlow/security/advisories/new"
