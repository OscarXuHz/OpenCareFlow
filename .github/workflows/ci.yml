name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public-tree hygiene
        run: bash scripts/oss-preflight.sh

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check app tests
      - name: Tests without private configuration
        env:
          LLM_PROVIDER: mock
          DEEPSEEK_API_KEY: ""
          AZURE_OPENAI_ENDPOINT: ""
          AZURE_OPENAI_API_KEY: ""
          DASHSCOPE_API_KEY: ""
        run: pytest
      - name: Build wheel
        run: python -m build --wheel --outdir /tmp/careflow-dist
      - name: Verify packaged prompts
        run: |
          python -m venv /tmp/careflow-wheel-test
          /tmp/careflow-wheel-test/bin/pip install /tmp/careflow-dist/*.whl
          cd /tmp
          /tmp/careflow-wheel-test/bin/python -c "from app.services.visit_note_agent.llm_client import load_base_system_prompt; assert load_base_system_prompt('home_visit')"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev
